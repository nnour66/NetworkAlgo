default:
  image: "$GLOBAL_IMAGE"

stages:
  - build
  - test

build_4:
  stage: build
  script:
    - cd 4-retransmission-continue
    - make
  artifacts:
    paths:
      - 4-retransmission-continue/gbn-sender
      - 4-retransmission-continue/gbn-receiver
      - 4-retransmission-continue/medium

# run tests using the binary build before
test_4:
  stage: test
  needs: [build_4]
  script:
  - |
    echo "starting test"
    cd 4-retransmission-continue
    make test
