default:
  image: "$GLOBAL_IMAGE"

stages:
  - build
  - test

build_1.1:
  stage: build
  script:
    - cd 1.1-adresse-ip
    - make
  artifacts:
    paths:
      - 1.1-adresse-ip/conv

# run tests using the binary build before
test_1.1:
  stage: test
  needs: [build_1.1]
  script:
  - |
    echo "starting test"
    cd 1.1-adresse-ip
    make test
