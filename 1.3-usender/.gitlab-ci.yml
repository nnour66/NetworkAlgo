default:
  image: "$GLOBAL_IMAGE"

stages:
  - build
  - test

build_1.3:
  stage: build
  script:
    - cd 1.3-usender
    - make
  artifacts:
    paths:
      - 1.3-usender/usender

# run tests using the binary build before
test_1.3:
  stage: test
  needs: [build_1.3]
  script:
  - |
    echo "starting test"
    cd 1.3-usender
    make test
