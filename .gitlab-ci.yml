variables:
  GLOBAL_IMAGE: "registry.app.unistra.fr/montavont/img-docker/algores"

stages:
  - triggers

trigger_exo1.1:
  stage: triggers
  trigger:
    include: 1.1-adresse-ip/.gitlab-ci.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
